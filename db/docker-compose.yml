version: '3.8'
services:
  db:
    image: postgres:16
    container_name: db
    restart: always
    environment:
      POSTGRES_HOST=db_1
      POSTGRES_PORT=5432
      POSTGRES_DB=devutils
      POSTGRES_USER=postgres
      POSTGRES_PASSWORD=1234
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  pg_data:
